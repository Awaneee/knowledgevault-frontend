name: knowledgevault
description: "KnowledgeVault — your AI-powered personal knowledge base."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # HTTP client
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Local cache (offline support)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0

  # File picking
  file_picker: ^8.0.0

  # Shimmer loading skeletons
  shimmer: ^3.0.0

  # Date formatting
  intl: ^0.19.0

  # Theme preference persistence
  shared_preferences: ^2.2.0

  # Offline connectivity detection
  connectivity_plus: ^6.0.0

  # Markdown rendering for LLM answers
  flutter_markdown: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
